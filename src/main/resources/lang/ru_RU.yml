messages:
  prefix: "&8[&cРепорты&8]"

  error:
    no-permission: "{prefix} &cУ вас нет прав для этого!"
    player-only: "{prefix} &cЭту команду могут использовать только игроки!"
    invalid-player: "{prefix} &cТакой игрок не существует!"
    invalid-group: "{prefix} &cНеверная группа статуса репорта."
    report-not-found: "{prefix} &cРепорт не найден!"
    no-reports: "{prefix} &cУ вас нет активных репортов!"
    no-status-reports: "{prefix} &cРепортов со статусом &f{status} &cне найдено."
    status-invalid: "{prefix} &cНеверный статус! Доступные: &f{statuses}"
    category-invalid: "{prefix} &cНеверная категория! Доступные: &f{categories}"
    custom-reason-disabled: "{prefix} &cСвои причины сейчас отключены."
    custom-reason-too-short: "{prefix} &cПричина слишком короткая! Минимум: &f{min} &cсимволов"
    custom-reason-too-long: "{prefix} &cПричина слишком длинная! Максимум: &f{max} &cсимволов"
    usage-report: "{prefix} &fИспользование: &c/report <игрок> [причина]"
    usage-viewreport: "{prefix} &fИспользование: &c/viewreport <id>"
    usage-setstatus: "{prefix} &fИспользование: &c/setreportstatus <id> to <статус>"
    invalid-report-id: "{prefix} &cНеверный ID репорта!"
    status-already-set: "{prefix} &cРепорт уже имеет этот статус!"
    cannot-report-self: "{prefix} &cВы не можете репортнуть самого себя."

  success:
    report-created: "{prefix} &fВаш репорт успешно &cотправлен&f!"

  report:
    cooldown: "{prefix} &fПодождите &c{time} &fперед отправкой следующего репорта."
    limit-reached: "{prefix} &cВы достигли максимального количества активных репортов."
    notification: "{prefix} &f{reporter} &cрепортнул &f{reported} &fпо причине: &c{category}"
    status-change: "{prefix} &fСтатус репорта &c#{id} &fизменён на &c{status}&f."
    custom-reason-prompt: "{prefix} &fВведите причину в чат. Сообщение будет приватным."

  admin:
    reload-success: "{prefix} &fКонфигурация успешно &cперезагружена&f!"
    reload-failure: "{prefix} &cОшибка перезагрузки конфигурации. Проверьте консоль."

