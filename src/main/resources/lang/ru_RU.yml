      pending:
        title: "&6• Ожидающие репорты"
        hover: "&fНажмите для просмотра"
      resolved:
        title: "&2• Решённые репорты"
        hover: "&fНажмите для просмотра"
      rejected:
        title: "&4• Отклонённые репорты"
        hover: "&fНажмите для просмотра"
    report_list:
      title: "&4&lРепорты: {status}\n"
      total: "&0Всего: &4{total}\n\n"
      entry: "&8{index}. &4{reported}"
      user_title: "&4&lВаши репорты\n"
      user_entry: "&8{index}. &4{reported} {color}({status})"

  container:
    shared:
      separator: "&8&m                                          &r"
      navigation:
        page_indicator:
          title: "&fСтраница &c{page} &fиз &c{total}"
          lore: "&fПоказано &c{start}-{end} &fиз &c{total} &fрепортов"
        previous_page:
          title: "&c&lПредыдущая страница"
          lore: "&fПерейти на страницу &c{page}"
        next_page:
          title: "&c&lСледующая страница"
          lore: "&fПерейти на страницу &c{page}"
        back_button:
          title: "&c&lНазад"
          lore: "&fВернуться к категориям"

    menus:
      main_menu:
        title: "&8[&cРепорты&8]"
        pending:
          title: "&6&lОжидающие репорты"
          lore:
            description: "&fПросмотр всех ожидающих репортов."
            action: "&cНажмите для просмотра!"
        resolved:
          title: "&a&lРешённые репорты"
          lore:
            description: "&fПросмотр всех решённых репортов."
            action: "&cНажмите для просмотра!"
        rejected:
          title: "&c&lОтклонённые репорты"
          lore:
            description: "&fПросмотр всех отклонённых репортов."
            action: "&cНажмите для просмотра!"

      category_view:
        title: "&8[&cРепорты&8] {status}"
        report_item:
          title: "&f{reporter} &8→ &c{reported}"
          lore:
            reason: "&fПричина: &c{reason}"
            status: "&fСтатус: &c{status}"
            id: "&fID: &c{id}"
            server: "&fСервер: &c{server}"
            action: "&c&lНажмите для управления"

      player_reports:
        title: "&8[&cРепорты&8] Мои репорты"

      reason_selector:
        title: "&8[&cРепорт&8] {target}"
        info_icon:
          title: "&c&lРепорт на: &f{target}"
          lore:
            - ""
            - "&fВыберите причину репорта"
            - "&fНажмите на значок для отправки"
            - ""
        reason_item:
          title: "&c&l{reason}"
          lore:
            target: " "
            action: "&fНажмите для отправки репорта"
        custom_reason_item:
          title: "&c&lСвоя причина"
          lore: "&fНажмите, чтобы ввести свою причину"

    manage_report:
      title: "&8[&cРепорт&8] #{id}"
      back_button:
        title: "&c&lНазад"
        lore: "&fВернуться к репортам: &c{status}"
      details:
        title: "&c&lДетали репорта"
        lore:
          reporter: "&fРепортер: &c{reporter}"
          reported: "&fНарушитель: &c{reported}"
          reason: "&fПричина: &c{reason}"
          status: "&fСтатус: &c{status}"
          id: "&fID: &c{id}"
          server: "&fСервер: &c{server}"
          created_at: "&fСоздан: &c{date}"
          updated_at: "&fОбновлён: &c{date}"
          last_updated_by: "&fИзменил: &c{name}"
      pending:
        title: "&6&lПеревести в ожидание"
        lore:
          description: "&fОтметить репорт как ожидающий рассмотрения."
          current_status: "&fТекущий статус: &c{status}"
          action: "&6Нажмите для смены статуса"
      resolved:
        title: "&a&lОтметить как решённый"
        lore:
          description: "&fОтметить репорт как решённый."
          current_status: "&fТекущий статус: &c{status}"
          action: "&aНажмите для смены статуса"
      rejected:
        title: "&c&lОтклонить репорт"
        lore:
          description: "&fОтклонить репорт как недействительный."
          current_status: "&fТекущий статус: &c{status}"
          action: "&cНажмите для смены статуса"

